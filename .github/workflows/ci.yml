name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleardata
          POSTGRES_PASSWORD: cleardata_dev_password
          POSTGRES_DB: cleardata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check apps/api

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://cleardata:cleardata_dev_password@localhost:5432/cleardata
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          cd apps/api
          pytest

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci

      - name: Lint frontend
        run: |
          cd apps/web
          npm run lint

      - name: Build frontend
        run: |
          cd apps/web
          npm run build
